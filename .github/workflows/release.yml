name: Release

# Pushing a tag such as v0.2.0 checks that commit as CI does, then publishes
# whichever packages npm doesn't have at that version yet, so a release that
# failed halfway can be rerun. npm trusts this workflow to publish (trusted
# publishing), so no npm token is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun test packages/browser-runtime
      - run: bun run coverage:check
      - run: bun run docs:check
      - run: bun run build
      - run: bun run package:check
      - run: bun run test:e2e
      - run: bun run release:pack --tag "$GITHUB_REF_NAME" --publish
