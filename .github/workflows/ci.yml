name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run lint
      - run: bun test
      - run: bun run docs:check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
