<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>js-game-zero Documentation</title>
    <link rel="icon" href="/client/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("jgz-sandbox:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.jgzTheme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/client/app.css" />
  </head>
  <body class="docs-page">
    <div class="docs-page-shell" data-jgz-docs-page>
      <header class="docs-page-header">
        <a class="brand" href="/">
          <span data-jgz-logo="small" data-size="34"></span>
          <span class="brand-name">js-game-zero</span>
        </a>
        <span class="topbar-divider" aria-hidden="true"></span>
        <h1 class="docs-page-title">Documentation</h1>
        <div class="topbar-spacer"></div>
        <nav class="docs-page-actions" aria-label="Main">
          <a class="nav-button" href="/">
            <span data-jgz-icon="code"></span>
            <span class="nav-button-label">Sandbox</span>
          </a>
          <button
            type="button"
            class="nav-button nav-button-icon theme-toggle"
            data-jgz-theme-toggle
            aria-label="Switch color mode"
            title="Switch color mode"
          ></button>
        </nav>
      </header>
      <div class="docs-layout">
        <nav
          class="docs-navigation"
          aria-label="Documentation"
          data-jgz-docs-navigation
        ></nav>
        <main
          class="docs-content"
          aria-live="polite"
          tabindex="-1"
          data-jgz-docs-content
        ></main>
      </div>
    </div>
    <script type="module" src="/client/docs.js"></script>
  </body>
</html>
